name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Ensure project screenshots are published
        run: |
          mkdir -p dist/assets
          cp -f public/assets/fasttrack-story.png dist/assets/fasttrack-story.png
          cp -f public/assets/miarmario-story.png dist/assets/miarmario-story.png
          test -s dist/assets/fasttrack-story.png
          test -s dist/assets/miarmario-story.png
          echo "Project screenshots included in Pages artifact:"
          ls -lh dist/assets/fasttrack-story.png dist/assets/miarmario-story.png
          file dist/assets/fasttrack-story.png dist/assets/miarmario-story.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
